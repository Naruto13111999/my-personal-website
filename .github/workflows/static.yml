name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # If your Go app lives in a subfolder of the GitHub repo, set this to that folder name.
  # Example: my-personal-website/gyanankur.dev/ → use "gyanankur.dev"
  # If go.mod is at the repo root, use "."
  SITE_DIR: gyanankur.dev

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: ${{ env.SITE_DIR }}/go.mod

      - name: Build static site
        working-directory: ${{ env.SITE_DIR }}
        run: go run ./cmd/staticexport

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
